<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alta Vibe — Festa 31/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --noite:#07030c; --roxo:#1b0a2e; --nevoa:#3a1c5c;
  --laranja:#ff7a1a; --ambar:#ffb347; --osso:#efe6d2;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background:
    radial-gradient(ellipse 80% 60% at 72% 18%, #2e1252 0%, transparent 60%),
    radial-gradient(ellipse 120% 80% at 50% 110%, #2a0f06 0%, transparent 55%),
    linear-gradient(180deg,#05020a 0%,var(--roxo) 55%,#0d0415 100%);
  color:var(--osso);
  font-family:"Cormorant Garamond",Georgia,serif;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* Lua */
.lua{
  position:fixed;top:9%;right:12%;width:clamp(110px,18vw,240px);aspect-ratio:1;border-radius:50%;
  background:
    radial-gradient(circle at 30% 28%,#fff6dc 0%,#f3d9a0 45%,#c99a55 100%);
  box-shadow:0 0 60px 20px rgba(255,179,71,.28),0 0 220px 80px rgba(255,122,26,.16);
  opacity:.92;
}
.lua::before,.lua::after{content:"";position:absolute;border-radius:50%;background:rgba(120,70,20,.22)}
.lua::before{width:22%;height:22%;left:56%;top:22%}
.lua::after{width:14%;height:14%;left:24%;top:58%;box-shadow:34px 20px 0 -2px rgba(120,70,20,.18)}

/* Névoa */
.nevoa{position:fixed;left:-30%;width:160%;height:38%;bottom:0;pointer-events:none;
  background:radial-gradient(ellipse 50% 60% at 30% 70%,rgba(90,50,140,.38),transparent 70%),
             radial-gradient(ellipse 40% 55% at 75% 60%,rgba(90,50,140,.3),transparent 70%);
  filter:blur(26px);animation:deriva 38s linear infinite alternate}
.nevoa.b{bottom:-4%;height:30%;opacity:.7;animation-duration:55s;animation-direction:alternate-reverse}
@keyframes deriva{from{transform:translateX(-8%)}to{transform:translateX(8%)}}

/* Morcegos */
.morcego{position:fixed;left:-80px;width:48px;fill:#030106;opacity:.95;animation:voa linear infinite;will-change:transform}
.morcego svg{display:block;width:100%;animation:bate .28s ease-in-out infinite alternate;transform-origin:center}
@keyframes voa{
  0%{transform:translate(0,0) scale(var(--s,1))}
  50%{transform:translate(55vw,var(--y2,-8vh)) scale(var(--s,1))}
  100%{transform:translate(115vw,var(--y3,6vh)) scale(var(--s,1))}
}
@keyframes bate{from{transform:scaleY(1)}to{transform:scaleY(.55)}}

/* Cenário */
.cenario{position:fixed;left:0;right:0;bottom:0;width:100%;height:46vh;min-height:230px;pointer-events:none}
.brilho{animation:vela 3.2s ease-in-out infinite}
.brilho:nth-of-type(2n){animation-duration:2.4s;animation-delay:-.8s}
@keyframes vela{0%,100%{opacity:1}45%{opacity:.78}55%{opacity:.95}70%{opacity:.7}}

/* Texto */
main{position:relative;z-index:2;height:100%;display:grid;place-content:center start;text-align:left;padding:0 24px 12vh clamp(24px,7vw,110px)}
h1{
  margin:0;font-family:"Creepster","Cormorant Garamond",Georgia,serif;font-weight:400;
  font-size:clamp(1.7rem,6.5vw,4.75rem);line-height:.95;letter-spacing:.03em;color:var(--laranja);
  text-shadow:0 0 12px rgba(255,122,26,.65),0 0 48px rgba(255,122,26,.35),0 4px 0 #5a1d00;
  animation:acende 2.2s ease-out both,pisca 7s 2.2s infinite;
}
p{margin:1rem 0 0;font-style:italic;font-weight:500;font-size:clamp(.8rem,1.3vw,.9rem);color:var(--osso);opacity:.8;letter-spacing:.04em}
@keyframes acende{0%{opacity:0;filter:blur(8px)}35%{opacity:.25}45%{opacity:0}60%{opacity:.9}100%{opacity:1;filter:none}}
@keyframes pisca{0%,93%,100%{opacity:1}94%{opacity:.5}95%{opacity:1}96%{opacity:.35}97%{opacity:1}}

/* Bruxa */
.bruxa{position:fixed;left:0;top:calc(9vh + 6vw);width:clamp(80px,11vw,150px);pointer-events:none;
  filter:drop-shadow(0 0 5px rgba(170,120,255,.55));opacity:0;animation:bruxa 30s linear 3s infinite;will-change:transform}
.bruxa svg{display:block;width:100%;overflow:visible;animation:balanca 1.6s ease-in-out infinite alternate}
@keyframes balanca{from{transform:translateY(-3px) rotate(-1.5deg)}to{transform:translateY(4px) rotate(1.5deg)}}
@keyframes bruxa{
  0%{opacity:1;transform:translate(-20vw,12vh) rotate(6deg)}
  20%{opacity:1;transform:translate(40vw,4vh) rotate(-2deg)}
  30%{opacity:1;transform:translate(79vw,-2vh) rotate(-6deg)}
  42%{opacity:1;transform:translate(125vw,-12vh) rotate(-12deg)}
  42.1%,100%{opacity:0;transform:translate(125vw,-12vh)}
}
/* Raios e clima tenebroso */
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 90% 70% at 50% 0%,rgba(235,222,255,.95),rgba(120,80,200,.4) 55%,rgba(40,10,70,.25))}
#raio{opacity:0}
.vinheta{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(0,0,0,.72) 100%)}
.olhos{position:fixed;left:46%;bottom:10vh;display:flex;gap:16px;opacity:0;pointer-events:none;animation:olhar 14s infinite}
.olhos i{width:9px;height:5px;border-radius:50%;background:#ff2a1a;box-shadow:0 0 10px 3px rgba(255,40,20,.7)}
@keyframes olhar{0%,58%{opacity:0;transform:scaleY(1)}60%{opacity:1}65%{transform:scaleY(1)}66%{transform:scaleY(.1)}68%{transform:scaleY(1)}80%{opacity:1}82%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .morcego,.olhos,.flash,#raio,.bruxa{display:none}
}
</style>
</head>
<body>

<canvas id="ceu" aria-hidden="true"></canvas>
<div class="lua" aria-hidden="true"></div>
<div class="nevoa" aria-hidden="true"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="bat" viewBox="0 0 48 20">
      <path d="M0 10C5 0 10 2 15 8c3-4 5-4 7 0l2-4 2 4c2-4 4-4 7 0C38 2 43 0 48 10c-5-2-8 0-12 4-2-2-4-2-6 2l-6-4-6 4c-2-4-4-4-6-2-4-4-7-6-12-4z"/>
    </symbol>
    <radialGradient id="abobora" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ff9a2e"/><stop offset=".7" stop-color="#d9570a"/><stop offset="1" stop-color="#7a2a02"/>
    </radialGradient>
    <g id="cara">
      <ellipse cx="0" cy="0" rx="62" ry="50" fill="url(#abobora)"/>
      <path d="M-22 -48C-34 -20-34 20-22 48M22 -48C34 -20 34 20 22 48M0 -50V50" stroke="#7a2a02" stroke-width="3" fill="none" opacity=".55"/>
      <rect x="-3" y="-64" width="7" height="18" rx="2" fill="#3b2a07"/>
      <g class="brilho" fill="#ffd36b" style="filter:drop-shadow(0 0 6px #ffb347)">
        <path d="M-38 -14L-14 -14L-26 -34Z"/><path d="M14 -14L38 -14L26 -34Z"/>
        <path d="M-6 0L6 0L0 -12Z" transform="translate(0 8)"/>
        <path d="M-40 14L-26 24L-14 16L-2 26L10 16L22 24L40 14L34 34L18 40L0 34L-18 40L-34 34Z"/>
      </g>
    </g>
  </defs>
</svg>

<div class="flash" aria-hidden="true"></div>
<canvas id="raio" aria-hidden="true"></canvas>

<div class="morcego" style="top:14%;--s:1;--y2:-6vh;--y3:10vh;animation-duration:19s;animation-delay:-3s" aria-hidden="true"><svg><use href="#bat"/></svg></div>
<div class="morcego" style="top:26%;--s:.7;--y2:6vh;--y3:-4vh;animation-duration:26s;animation-delay:-14s" aria-hidden="true"><svg><use href="#bat"/></svg></div>
<div class="morcego" style="top:8%;--s:1.4;--y2:10vh;--y3:2vh;animation-duration:31s;animation-delay:-22s" aria-hidden="true"><svg><use href="#bat"/></svg></div>
<div class="morcego" style="top:34%;--s:.55;--y2:-10vh;--y3:5vh;animation-duration:22s;animation-delay:-9s" aria-hidden="true"><svg><use href="#bat"/></svg></div>

<svg class="cenario" viewBox="0 0 1440 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!-- árvore morta -->
  <g stroke="#030106" fill="none" stroke-linecap="round">
    <path d="M250 400C246 330 252 290 244 240" stroke-width="22"/>
    <path d="M246 280C210 250 170 240 130 190M244 250C280 215 320 205 350 150M247 300C290 290 330 270 380 280" stroke-width="12"/>
    <path d="M160 215C150 190 150 170 128 150M130 190C110 188 90 170 70 172M315 190C320 165 336 150 334 120M350 150C372 150 392 134 410 138M200 238C196 222 200 205 190 188" stroke-width="6"/>
  </g>
  <!-- colinas -->
  <path d="M0 330C180 290 340 310 520 335C720 360 900 290 1100 305C1250 316 1360 300 1440 285V400H0Z" fill="#05020a"/>
  <path d="M0 365C260 335 480 372 720 358C960 344 1200 372 1440 350V400H0Z" fill="#030106"/>
  <!-- cerca -->
  <g fill="#030106">
    <path d="M980 400V300L988 290L996 300V400ZM1030 400V296L1038 286L1046 296V400ZM1080 400V300L1088 290L1096 300V400Z"/>
    <rect x="970" y="318" width="136" height="7"/><rect x="970" y="350" width="136" height="7"/>
  </g>
  <!-- abóboras -->
  <g transform="translate(560 352) scale(1.15)"><use href="#cara"/></g>
  <g transform="translate(760 372) scale(.7)"><use href="#cara"/></g>
  <g transform="translate(1230 356) scale(.95)"><use href="#cara"/></g>
  <g transform="translate(1340 376) scale(.55)"><use href="#cara"/></g>
</svg>

<div class="bruxa" aria-hidden="true">
  <svg viewBox="0 -12 120 70" fill="#030106" stroke="#030106" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 40L112 30" stroke-width="3" fill="none"/>
    <path d="M0 33L24 37L24 43L0 50L8 41Z" stroke-width="1"/>
    <path d="M56 36C52 26 58 20 66 22C74 24 77 30 75 37Z" stroke-width="1"/>
    <path d="M56 30C42 22 32 34 14 28C30 42 44 42 57 37Z" stroke-width="1"/>
    <circle cx="70" cy="15" r="5.5" stroke-width="1"/>
    <path d="M60 11L84 11" stroke-width="3" fill="none"/>
    <path d="M66 11L74 -4L79 11Z" stroke-width="1"/>
    <path d="M74 -4L68 -9" stroke-width="2.5" fill="none"/>
    <path d="M66 37L65 47L59 53M73 37L77 47L72 54" stroke-width="3.5" fill="none"/>
    <path d="M72 28L88 31" stroke-width="3" fill="none"/>
  </svg>
</div>
<div class="olhos" aria-hidden="true"><i></i><i></i></div>
<div class="vinheta" aria-hidden="true"></div>

<main>
  <h1>ALTA VIBE</h1>
  <p>Festa dia 31/10 | 19h | Bingos | Emissão Especial</p>
</main>

<script>
(function(){
  var c=document.getElementById('ceu'),x=c.getContext('2d'),W,H,dpr=Math.min(window.devicePixelRatio||1,2);
  var estrelas=[],brasas=[];
  var reduz=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tam(){
    W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
    estrelas=[];
    for(var i=0;i<Math.round(W*H/5500);i++)estrelas.push({x:Math.random()*W,y:Math.random()*H*.7,r:Math.random()*1.2+.2,f:Math.random()*6});
    brasas=[];
    for(var j=0;j<Math.round(W/24);j++)brasas.push(nova(true));
  }
  function nova(ini){
    return {x:Math.random()*W,y:ini?Math.random()*H:H+10,r:Math.random()*1.8+.6,v:Math.random()*.5+.2,d:Math.random()*Math.PI*2,a:Math.random()*.6+.3};
  }
  function desenha(t){
    x.clearRect(0,0,W,H);
    estrelas.forEach(function(s){
      var a=.35+.35*Math.sin(t/900+s.f);
      x.fillStyle='rgba(239,230,210,'+a.toFixed(2)+')';
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();
    });
    brasas.forEach(function(b,i){
      if(!reduz){b.y-=b.v;b.x+=Math.sin(t/1200+b.d)*.35;}
      if(b.y<-10)brasas[i]=nova(false);
      var g=x.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*4);
      g.addColorStop(0,'rgba(255,170,60,'+b.a+')');g.addColorStop(1,'rgba(255,122,26,0)');
      x.fillStyle=g;x.beginPath();x.arc(b.x,b.y,b.r*4,0,6.283);x.fill();
    });
    requestAnimationFrame(desenha);
  }
  /* Raios */
  var rc=document.getElementById('raio'),rx=rc.getContext('2d'),fl=document.querySelector('.flash');
  function rtam(){rc.width=W*dpr;rc.height=H*dpr;rx.setTransform(dpr,0,0,dpr,0,0);}
  function seg(ax,ay,bx,by,d,w){
    if(d===0){rx.lineWidth=w;rx.beginPath();rx.moveTo(ax,ay);rx.lineTo(bx,by);rx.stroke();return;}
    var L=Math.hypot(bx-ax,by-ay);
    var mx=(ax+bx)/2+(Math.random()-.5)*L*.45,my=(ay+by)/2+(Math.random()-.5)*L*.2;
    seg(ax,ay,mx,my,d-1,w);seg(mx,my,bx,by,d-1,w);
    if(d>3&&Math.random()<.35)seg(mx,my,mx+(Math.random()-.5)*W*.22,my+Math.random()*H*.3,d-2,w*.5);
  }
  function raio(){
    if(reduz)return;
    var sx=Math.random()*W*.8+W*.1;
    rx.clearRect(0,0,W,H);
    rx.strokeStyle='rgba(235,225,255,.95)';rx.shadowColor='#a77bff';rx.shadowBlur=26;rx.lineCap='round';
    seg(sx,-10,sx+(Math.random()-.5)*W*.25,H*(.55+Math.random()*.2),7,3);
    var k=[{opacity:1},{opacity:.1,offset:.15},{opacity:.9,offset:.3},{opacity:.2,offset:.5},{opacity:0}];
    rc.animate(k,{duration:750});
    fl.animate([{opacity:.9},{opacity:.1,offset:.15},{opacity:.7,offset:.3},{opacity:.15,offset:.55},{opacity:0}],{duration:900});
    setTimeout(function(){rx.clearRect(0,0,W,H);},800);
  }
  function agenda(ms){setTimeout(function(){raio();agenda(4000+Math.random()*8000);},ms);}
  addEventListener('resize',function(){tam();rtam();});tam();rtam();agenda(2500);requestAnimationFrame(desenha);
})();
</script>
</body>
</html>
